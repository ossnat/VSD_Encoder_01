type: vgg
name: vgg16
pretrained: true
preprocess: imagenet_rgb

# Spatial activation map after this VGG stage.
# Choices: block1_prepool (2nd conv+ReLU, 224×224), block1–block5 (post MaxPool),
# avgpool, or early mega-pixel pools:
#   block1_pool7, block1_pool14, block2_pool7, block2_pool14, block3_pool14
feature_layer: block4

input_size: 224
input_channels: 3
input_scaling: none
imagenet_normalize: true

batch_size: 16
