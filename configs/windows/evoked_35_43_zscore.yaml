# Per-pixel mean over frames [35, 43) with per-trial baseline z-score.
#
# Frame indexing is 0-based and half-open throughout:
#   analysis:  [35, 43) → frames 35..42 inclusive
#   baseline:  [2, 26)  → frames 2..25 inclusive (per-pixel mean/std)
# Each pixel is z-scored as (x - mean) / max(std, eps) before averaging.
# Aliases: normalization may also be written as zscore_baseline; none/raw = off.

window_id: win_0035_0043_zscore
start_frame: 35
end_frame: 43
avg_method: mean
normalization: baseline_zscore
baseline_start_frame: 2
