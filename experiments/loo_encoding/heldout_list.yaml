# Held-out stimulus identities for LOO protocols A and B (same list).
# Missing IDs are skipped at fold-build time. Glob patterns (e.g. letter_*)
# are expanded against encoding-pair stimulus_ids.
#
# 201118b remains excluded from catalog/pairs (Control-attention, not letters).
# 201118a letters may be in encoding pairs for *training*; skip them as
# Protocol A/C test folds via train_only_sessions / --train-only-dates.

heldout_stimulus_ids:
  - black_bar_horizontal_1
  - black_bar_vertical_1
  - black_circle_contour_0.3
  - black_circle_contour_0.95
  - black_filled_circle_0.3
  - black_point_0.05
  - black_point_0.1
  - black_triangle_contour_0.4
  - letter_A_white_1
  - letter_D_white_1
  - letter_F_white_1
  - letter_G_white_1
  - letter_L_white_1
  - letter_N_white_1
  - white_circle_contour_0.3
  - white_filled_circle_0.3
  - white_filled_circle_0.8
  - white_point_0.1

train_only_sessions:
  - 201118a
