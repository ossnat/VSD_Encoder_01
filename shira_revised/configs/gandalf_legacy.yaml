# Golden Schira + registration params extracted from legacy mats.
# Used by shira_revised scripts/tests — not wired into main encoding.

ppd: 35
stim_hw: [301, 512]   # rows, cols — legacy canvas
chamber_hw: [100, 100]
model: 2
b: 201                # monopole branch in trans_cortex
iso_polar_grad: 0.1821
ecc_width: 0.7609
left_hemisphere: true
low_hemisphere: true
alpha_mode: divide    # live lab convention (T = theta / alpha)

# Amit reference (winner201118.mat / parameters.mat)
amit_201118:
  a: 0.39
  alpha: 1.5
  k: 1.0
  # points rows: [brain_row, brain_col, vf_x_deg, vf_y_deg]
  anchors:
    - {brain: [25, 36], vf_deg: [0.5, -0.4]}
    - {brain: [48, 55], vf_deg: [1.5, -0.4]}

